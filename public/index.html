<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <title>Deno LAN File Sharing App</title>
  <link rel="stylesheet" type="text/css" href="main.min.css">
</head>
<body>
<header>
  <h1>Shario</h1>
  <div class="row">
    <div class="header-action" id="language"><img src="/assets/globe.svg" class="icon" alt="language"></div>
    <div class="header-action" id="qr"><img src="/assets/qr.svg" class="icon" alt="qr"></div>
    <div class="header-action" id="help"><img src="/assets/interrogation.svg" class="icon" alt="help"></div>
  </div>
</header>

<div id="content">
  <section id="files-section">
    <div class="section-header">
      <h2 id="files-header"></h2>
      <div class="row">
        <div class="header-action" id="upload-files"><img src="/assets/plus.svg" class="icon" alt="upload"></div>
        <div class="header-action" id="download-files"><img src="/assets/download.svg" class="icon" alt="download"></div>
        <div class="header-action" id="delete-files"><img src="/assets/trash.svg" class="icon" alt="delete"></div>
      </div>
    </div>
    <input id="file-upload" type="file" multiple hidden/>
    <div class="files-table-container">
      <table></table>
    </div>
  </section>

  <section id="notes-section">
    <div class="section-header">
      <h2 id="note-header"></h2>
      <div class="row">
        <div class="header-action" id="save-as-file"><img src="/assets/disk.svg" class="icon" alt="save"></div>
        <div class="header-action" id="copy-text"><img src="/assets/copy.svg" class="icon" alt="copy"></div>
        <div class="header-action" id="clear-text"><img src="/assets/broom.svg" class="icon" alt="clear"></div>
      </div>
    </div>
    <textarea></textarea>
  </section>
</div>

<footer>
  <div class="footer-link" id="files-footer-link"></div>
  <div class="footer-link" id="notes-footer-link"></div>
</footer>

<dialog></dialog>

<div id="overlay" class="drag-overlay"></div>

<script src="script.min.js"></script>
</body>
</html>
